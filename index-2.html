<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Sh4d0w Directory</title>
  <style>
    :root {
      --bg: #0b0c10;
      --card: #15171c;
      --card-hover: #1c1f26;
      --text: #f0f2f5;
      --muted: #8b93a7;
      --accent: #6c5ce7;
      --border: rgba(255,255,255,0.06);
      --radius: 16px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* ========== SPLASH ========== */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.7s ease, visibility 0.7s;
    }

    #splash.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    #splash img {
      width: min(220px, 55vw);
      height: auto;
      animation: logoIn 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      filter: drop-shadow(0 0 40px rgba(108, 92, 231, 0.35));
    }

    #splash .copy {
      margin-top: 28px;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0;
      animation: fadeUp 0.8s 0.5s ease forwards;
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.82) translateY(12px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ========== MAIN ========== */
    #app {
      opacity: 0;
      transition: opacity 0.5s ease 0.2s;
      padding-bottom: 40px;
    }

    #app.show { opacity: 1; }

    header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(11, 12, 16, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* ========== SECTIONS ========== */
    .section-label {
      position: sticky;
      top: 72px;
      z-index: 40;
      background: rgba(11, 12, 16, 0.92);
      backdrop-filter: blur(12px);
      padding: 10px 20px 6px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .section-label.pinned {
      color: #f1c40f;
    }

    /* ========== USER CARD ========== */
    .user-list {
      padding: 0 14px;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      background: var(--card);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.18s, transform 0.18s, border-color 0.18s;
      position: relative;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
    }

    .user-card:active {
      transform: scale(0.985);
    }

    .user-card:hover {
      background: var(--card-hover);
      border-color: rgba(255,255,255,0.1);
    }

    /* Nameplate background layer */
    .nameplate {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0.22;
      pointer-events: none;
      z-index: 0;
    }

    .user-card > * {
      position: relative;
      z-index: 1;
    }

    /* Effects */
    .effect-gold {
      background: linear-gradient(135deg, #2a2110 0%, #1a160c 100%);
      border-color: rgba(241, 196, 15, 0.35);
      box-shadow: 0 0 0 1px rgba(241, 196, 15, 0.08), inset 0 0 30px rgba(241, 196, 15, 0.04);
    }
    .effect-gold .username { color: #f1c40f; }

    .effect-silver {
      background: linear-gradient(135deg, #1e2228 0%, #15181d 100%);
      border-color: rgba(189, 195, 199, 0.3);
      box-shadow: 0 0 0 1px rgba(189, 195, 199, 0.06);
    }
    .effect-silver .username { color: #d5d8dc; }

    .effect-bronze {
      background: linear-gradient(135deg, #2a1c12 0%, #1a120c 100%);
      border-color: rgba(205, 127, 50, 0.35);
    }
    .effect-bronze .username { color: #cd7f32; }

    .effect-sparkle {
      background: linear-gradient(135deg, #1a1230 0%, #0f0c1a 100%);
      border-color: rgba(162, 155, 254, 0.3);
    }
    .effect-sparkle::after {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(1.5px 1.5px at 20% 30%, rgba(255,255,255,0.7), transparent),
        radial-gradient(1.5px 1.5px at 70% 60%, rgba(255,255,255,0.5), transparent),
        radial-gradient(1px 1px at 40% 80%, rgba(255,255,255,0.6), transparent),
        radial-gradient(1.5px 1.5px at 85% 25%, rgba(255,255,255,0.4), transparent),
        radial-gradient(1px 1px at 10% 70%, rgba(255,255,255,0.5), transparent);
      animation: twinkle 3.5s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes twinkle {
      0%   { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* Avatar */
    .avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      background: #2a2d35;
      border: 2px solid rgba(255,255,255,0.08);
    }

    .info {
      flex: 1;
      min-width: 0;
    }

    .username-row {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-wrap: wrap;
    }

    .username {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .handle {
      font-size: 13px;
      color: var(--muted);
      margin-top: 2px;
    }

    /* Tags / Badges */
    .tags {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .tag {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 6px;
      line-height: 1.4;
    }

    .tag-owner {
      background: rgba(231, 76, 60, 0.2);
      color: #e74c3c;
      border: 1px solid rgba(231, 76, 60, 0.3);
    }

    .tag-vip {
      background: rgba(155, 89, 182, 0.2);
      color: #bb6bd9;
      border: 1px solid rgba(155, 89, 182, 0.3);
    }

    .tag-pinned {
      background: rgba(241, 196, 15, 0.18);
      color: #f1c40f;
      border: 1px solid rgba(241, 196, 15, 0.3);
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: var(--muted);
      font-size: 15px;
    }

    /* Letter jump (optional quick nav) */
    .letter-nav {
      position: fixed;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1px;
      z-index: 60;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      user-select: none;
    }

    .letter-nav span {
      padding: 1px 4px;
      cursor: pointer;
      border-radius: 4px;
      transition: color 0.15s, background 0.15s;
    }

    .letter-nav span:hover,
    .letter-nav span.active {
      color: var(--text);
      background: rgba(255,255,255,0.08);
    }
  </style>
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div id="splash">
    <img src="splashlogo.png" alt="Logo" onerror="this.style.display='none'" />
    <div class="copy">© Sh4d0w Productions</div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <header>
      <h1>Directory</h1>
      <p>A–Z · Tap a profile to open</p>
    </header>

    <div id="content"></div>

    <div class="letter-nav" id="letterNav"></div>
  </div>

  <script>
    /* ============================================================
       USER DATA  –  Edit this array to manage everything
       ------------------------------------------------------------
       username   : Display name
       handle     : @handle (no @ symbol)
       avatar     : Path or URL to profile picture
       tags       : ["Owner", "VIP"]   ← only these two can be set here
       pinned     : true / false       ← setting true auto-adds "Pinned" tag
       nameplate  : Path/URL to nameplate image (optional)
       effect     : "gold" | "silver" | "bronze" | "sparkle" | null
       ============================================================ */
    const users = [
      {
        username: "Sh4d0w",
        handle: "sh4d0w",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Sh4d0w",
        tags: ["Owner"],
        pinned: true,
        nameplate: "",
        effect: "gold"
      },
      {
        username: "Aria Night",
        handle: "aria",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Aria",
        tags: ["VIP"],
        pinned: true,
        nameplate: "",
        effect: "sparkle"
      },
      {
        username: "Kai Storm",
        handle: "kai",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Kai",
        tags: [],
        pinned: false,
        nameplate: "",
        effect: "silver"
      },
      {
        username: "Luna Vale",
        handle: "lunav",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Luna",
        tags: ["VIP"],
        pinned: false,
        nameplate: "",
        effect: "bronze"
      },
      {
        username: "Nova Blade",
        handle: "nova",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Nova",
        tags: [],
        pinned: false,
        nameplate: "",
        effect: null
      },
      {
        username: "Rex Orion",
        handle: "rex",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Rex",
        tags: [],
        pinned: false,
        nameplate: "",
        effect: null
      },
      {
        username: "Zara Quinn",
        handle: "zara",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Zara",
        tags: ["VIP"],
        pinned: false,
        nameplate: "",
        effect: "gold"
      },
      {
        username: "Echo Frost",
        handle: "echo",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Echo",
        tags: [],
        pinned: false,
        nameplate: "",
        effect: null
      },
      {
        username: "Mira Sol",
        handle: "mira",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Mira",
        tags: [],
        pinned: false,
        nameplate: "",
        effect: "sparkle"
      },
      {
        username: "Theo Ash",
        handle: "theo",
        avatar: "https://api.dicebear.com/9.x/avataaars/svg?seed=Theo",
        tags: [],
        pinned: false,
        nameplate: "",
        effect: null
      }
    ];

    /* ============================================================
       APP LOGIC
       ============================================================ */

    // Splash → Main
    window.addEventListener("load", () => {
      setTimeout(() => {
        document.getElementById("splash").classList.add("hide");
        document.getElementById("app").classList.add("show");
      }, 2200);
    });

    // Build the list
    function render() {
      const content = document.getElementById("content");
      content.innerHTML = "";

      // Separate pinned
      const pinned = users.filter(u => u.pinned);
      const rest   = users.filter(u => !u.pinned);

      // Sort A-Z by username
      rest.sort((a, b) => a.username.localeCompare(b.username, undefined, { sensitivity: "base" }));

      // Group by first letter
      const groups = {};
      rest.forEach(u => {
        const letter = (u.username[0] || "#").toUpperCase();
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(u);
      });

      // Render pinned section
      if (pinned.length) {
        const label = document.createElement("div");
        label.className = "section-label pinned";
        label.textContent = "★ Pinned";
        content.appendChild(label);

        const list = document.createElement("div");
        list.className = "user-list";
        pinned.forEach(u => list.appendChild(createCard(u)));
        content.appendChild(list);
      }

      // Render A-Z sections
      const letters = Object.keys(groups).sort();
      letters.forEach(letter => {
        const label = document.createElement("div");
        label.className = "section-label";
        label.id = `letter-${letter}`;
        label.textContent = letter;
        content.appendChild(label);

        const list = document.createElement("div");
        list.className = "user-list";
        groups[letter].forEach(u => list.appendChild(createCard(u)));
        content.appendChild(list);
      });

      // Letter quick-nav
      buildLetterNav(letters);

      if (!pinned.length && !rest.length) {
        content.innerHTML = `<div class="empty">No users yet. Add some in the <code>users</code> array.</div>`;
      }
    }

    function createCard(user) {
      const a = document.createElement("a");
      a.className = "user-card";
      a.href = `/user/@${user.handle}`;

      // Effect class
      if (user.effect) {
        a.classList.add(`effect-${user.effect}`);
      }

      // Nameplate layer
      if (user.nameplate) {
        const np = document.createElement("div");
        np.className = "nameplate";
        np.style.backgroundImage = `url('${user.nameplate}')`;
        a.appendChild(np);
      }

      // Avatar
      const img = document.createElement("img");
      img.className = "avatar";
      img.src = user.avatar || "https://api.dicebear.com/9.x/avataaars/svg?seed=default";
      img.alt = user.username;
      img.onerror = () => { img.src = "https://api.dicebear.com/9.x/avataaars/svg?seed=fallback"; };
      a.appendChild(img);

      // Info
      const info = document.createElement("div");
      info.className = "info";

      const nameRow = document.createElement("div");
      nameRow.className = "username-row";

      const name = document.createElement("span");
      name.className = "username";
      name.textContent = user.username;
      nameRow.appendChild(name);

      // Tags (Pinned is auto-added if pinned === true)
      const tags = [...(user.tags || [])];
      if (user.pinned && !tags.includes("Pinned")) {
        tags.unshift("Pinned");
      }

      if (tags.length) {
        const tagWrap = document.createElement("div");
        tagWrap.className = "tags";
        tags.forEach(t => {
          const badge = document.createElement("span");
          badge.className = `tag tag-${t.toLowerCase()}`;
          badge.textContent = t;
          tagWrap.appendChild(badge);
        });
        nameRow.appendChild(tagWrap);
      }

      info.appendChild(nameRow);

      const handle = document.createElement("div");
      handle.className = "handle";
      handle.textContent = `@${user.handle}`;
      info.appendChild(handle);

      a.appendChild(info);
      return a;
    }

    function buildLetterNav(letters) {
      const nav = document.getElementById("letterNav");
      nav.innerHTML = "";
      letters.forEach(l => {
        const span = document.createElement("span");
        span.textContent = l;
        span.addEventListener("click", () => {
          const el = document.getElementById(`letter-${l}`);
          if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
        });
        nav.appendChild(span);
      });
    }

    // Start
    render();
  </script>
</body>
</html>
